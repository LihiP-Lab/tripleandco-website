<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Once · Platform Card, "No black box"</title>
<style>
  :root{
    --whisper:#FFF2EB; --peach:#FFD4B8; --tangerine:#FF8C5A;
    --once-orange:#F05A28; --ember:#C83A10; --flame:#902000;
    --warm-white:#FFFDFB; --ivory:#FAF3EC; --sand:#F7E7CE;
    --wheat:#EDD4A8; --caramel:#D4B880; --mocha:#A08060;
    --blush:#FAE1E1; --rose:#F0B8B8; --crimson:#D4607A;
    --berry:#8C1A40; --wine:#60032A; --noir:#380018;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ivory);display:flex;justify-content:center;padding:40px;font-family:'Helvetica Neue',Arial,sans-serif;}
  .post{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:linear-gradient(135deg,#7a0838 0%,var(--wine) 48%,var(--noir) 100%);
    transform:scale(.62);transform-origin:top center;margin-bottom:-410px;
  }
  .blob{position:absolute;border-radius:50%;}
  .blob.a{width:520px;height:520px;top:-180px;left:-120px;background:radial-gradient(circle at 35% 35%,#9c244e,#60032a);}
  .blob.b{width:360px;height:360px;bottom:-150px;right:-100px;background:radial-gradient(circle at 35% 35%,var(--berry),#48001f);opacity:.85;}
  .content{position:absolute;inset:0;padding:84px 84px 76px;display:flex;flex-direction:column;color:var(--warm-white);}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .logo-mark{width:60px;height:60px;}
  .eyebrow{font-size:27px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--peach);}
  .head{margin-top:54px;}
  .head h1{font-size:80px;line-height:.98;font-weight:800;letter-spacing:-.02em;}
  .head h1 .accent{color:var(--once-orange);}

  /* mock UI panel */
  .panel{margin-top:54px;background:rgba(255,253,251,.07);border:1px solid rgba(255,212,184,.25);border-radius:28px;padding:40px 44px;backdrop-filter:blur(2px);}
  .panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;}
  .panel-top .ttl{font-size:30px;font-weight:800;letter-spacing:-.01em;}
  .live{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;color:var(--peach);}
  .live .dot{width:16px;height:16px;border-radius:50%;background:#54d18a;box-shadow:0 0 0 6px rgba(84,209,138,.25);}
  .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .stage{background:rgba(255,253,251,.06);border-radius:18px;padding:22px 20px;border-top:5px solid var(--once-orange);}
  .stage .s-name{font-size:21px;font-weight:700;color:var(--peach);margin-bottom:16px;letter-spacing:.02em;}
  .cardlet{background:rgba(255,253,251,.10);border-radius:12px;padding:14px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
  .ava{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--tangerine),var(--ember));}
  .cardlet .nm{height:11px;border-radius:6px;background:rgba(255,253,251,.55);width:74px;}
  .cardlet .nm.short{width:50px;}
  .metrics{display:flex;gap:46px;margin-top:34px;}
  .metric .m-num{font-size:46px;font-weight:800;color:var(--warm-white);letter-spacing:-.02em;}
  .metric .m-num .u{font-size:26px;color:var(--peach);}
  .metric .m-lbl{font-size:20px;color:var(--caramel);font-weight:600;margin-top:4px;}

  .closer{display:flex;align-items:center;gap:24px;margin-top:auto;padding-top:46px;}
  .closer-rule{width:88px;height:8px;border-radius:8px;background:var(--once-orange);flex:none;}
  .closer-text{font-size:35px;font-weight:800;letter-spacing:-.005em;}
</style>
</head>
<body>
<div class="post">
  <div class="blob a"></div><div class="blob b"></div>
  <div class="content">
    <div class="topbar">
      <svg class="logo-mark" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="var(--once-orange)"/><circle cx="100" cy="88" r="64" fill="var(--wine)"/></svg>
      <div class="eyebrow">Full transparency, real time</div>
    </div>

    <div class="head">
      <h1>No black box.<br><span class="accent">Just the board.</span></h1>
    </div>

    <div class="panel">
      <div class="panel-top">
        <span class="ttl">Your live pipeline</span>
        <span class="live"><span class="dot"></span>Live</span>
      </div>
      <div class="stages">
        <div class="stage"><div class="s-name">Sourced</div>
          <div class="cardlet"><span class="ava"></span><span class="nm"></span></div>
          <div class="cardlet"><span class="ava"></span><span class="nm short"></span></div>
          <div class="cardlet"><span class="ava"></span><span class="nm"></span></div>
        </div>
        <div class="stage"><div class="s-name">Screened</div>
          <div class="cardlet"><span class="ava"></span><span class="nm short"></span></div>
          <div class="cardlet"><span class="ava"></span><span class="nm"></span></div>
        </div>
        <div class="stage"><div class="s-name">Client IV</div>
          <div class="cardlet"><span class="ava"></span><span class="nm"></span></div>
          <div class="cardlet"><span class="ava"></span><span class="nm short"></span></div>
        </div>
        <div class="stage"><div class="s-name">Offer</div>
          <div class="cardlet"><span class="ava"></span><span class="nm short"></span></div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="m-num">12</div><div class="m-lbl">open roles</div></div>
        <div class="metric"><div class="m-num">184</div><div class="m-lbl">in pipeline</div></div>
        <div class="metric"><div class="m-num">27<span class="u">d</span></div><div class="m-lbl">avg. time-to-hire</div></div>
      </div>
    </div>

    <div class="closer">
      <span class="closer-rule"></span>
      <span class="closer-text">The same view we see is the view you see.</span>
    </div>
  </div>
</div>
</body>
</html>
