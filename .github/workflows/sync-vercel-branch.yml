name: Sync Vercel production branch

on:
  push:
    branches: [initial-base]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git push origin HEAD:devin/1779626867-initial-website --force-with-lease
